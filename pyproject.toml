[project]
name = "sentinel2-landcover-lu"
version = "0.1.0"
description = "Sentinel-2 land-cover classification for Luxembourg using CORINE labels"
requires-python = ">=3.10"
dependencies = [
    # Core numerics
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    # Geospatial stack. rasterio and pyproj ship prebuilt GDAL/PROJ wheels, so
    # GDAL itself is NOT listed as a pip dependency: `pip install gdal` requires
    # a system libgdal whose version matches exactly and fails on most machines.
    # We use GDAL through rasterio's bindings (rasterio.__gdal_version__).
    "rasterio>=1.3.9",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    # STAC access (Element84 Earth Search -> public Sentinel-2 L2A COGs on AWS S3)
    "pystac-client>=0.7.0",
    "requests>=2.31.0",
    # Modelling
    "scikit-learn>=1.3.0",
    # Database
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    # Plotting / notebooks / UX
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "joblib>=1.5.3",
]

[project.optional-dependencies]
# Deep-learning extra: heavy (~2.5 GB) and only needed for the optional
# CNN/U-Net + CRF stage. Install with: uv sync --extra dl
dl = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # rasterio 1.5 reshapes read buffers in place; NumPy 2.5 deprecates that.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
