version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sentinel2_postgis
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
      POSTGRES_DB: landcover
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../sql:/sql
    restart: unless-stopped

volumes:
  postgis_data:
